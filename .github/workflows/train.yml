name: ML Training Pipeline

on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Re-use existing Kaggle dataset (Phase 3)'
        required: false
        default: 'false'
        type: boolean
      local_phase4:
        description: 'Run Phase 4 PPO locally (skip Kaggle)'
        required: false
        default: 'false'
        type: boolean

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/ml/requirements.txt kaggle

      - name: Set up Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          KEY="${{ secrets.KAGGLE_KEY }}"
          if [[ "$KEY" == KGAT_* ]]; then
            printf '{"token":"%s"}' "$KEY" > ~/.kaggle/kaggle.json
            echo "Kaggle credentials: API token format (KGAT_...)"
          else
            printf '{"username":"%s","key":"%s"}' "${{ secrets.KAGGLE_USERNAME }}" "$KEY" > ~/.kaggle/kaggle.json
            echo "Kaggle credentials: legacy key format"
          fi
          chmod 600 ~/.kaggle/kaggle.json
          kaggle config view || true

      - name: Download signal dataset from Kaggle
        continue-on-error: true
        run: |
          mkdir -p models
          SLUG="${{ secrets.KAGGLE_DATASET_SLUG }}"
          if [ -n "$SLUG" ]; then
            echo "Downloading $SLUG..."
            kaggle datasets download -d "$SLUG" -p models/ --unzip --force
            # Flatten any subdirectory Kaggle may have created
            SUBDIR="models/$(echo $SLUG | cut -d/ -f2)"
            if [ -d "$SUBDIR" ]; then
              echo "Flattening $SUBDIR into models/"
              mv "$SUBDIR"/* models/ 2>/dev/null || true
              rmdir "$SUBDIR" 2>/dev/null || true
            fi
            if [ -f models/signal_dataset.csv ]; then
              echo "signal_dataset.csv ready ($(du -h models/signal_dataset.csv | cut -f1))"
            else
              echo "WARNING: signal_dataset.csv not found — listing models/:"
              ls -la models/ | head -20
            fi
          else
            echo "KAGGLE_DATASET_SLUG not set — skipping"
          fi

      - name: Run training pipeline
        run: |
          ARGS="--skip-dataset"
          [ "${{ inputs.skip_upload }}" = "true" ]  && ARGS="$ARGS --skip-upload"
          [ "${{ inputs.local_phase4 }}" = "true" ] && ARGS="$ARGS --local-phase4"
          # Phase 1 HMM runs regardless; LGBM skips gracefully if dataset missing
          python scripts/ml/run_all.py $ARGS

      - name: Commit updated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          if git diff --staged --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "chore: update trained models [skip ci]"
            git push
          fi
